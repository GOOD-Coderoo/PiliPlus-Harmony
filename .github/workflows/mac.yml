name: Build for macOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-mac-app:
    name: Release macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"

      - name: Generate env.json
        run: dart .vscode/build_env.dart

      - name: Get dependencies
        run: flutter pub get
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:\s*//' | sed -E 's/\+.*$//' | tr -d ' ')
          echo "version=$v" >> $GITHUB_OUTPUT

      - name: Build macOS
        run: flutter build macos --release --dart-define-from-file=.vscode/env.json --no-pub

      - name: Prepare DMG
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliPlus.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv PiliPlus*.dmg PiliPlus_macos_${{ steps.ver.outputs.version }}.dmg

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: PiliPlus_macos_*.dmg

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macOS-app
          path: PiliPlus_macos_*.dmg
