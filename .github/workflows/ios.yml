name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-ios-app:
    name: Release iOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"

      - name: Generate env.json
        run: dart .vscode/build_env.dart

      - name: Get dependencies
        run: flutter pub get
        env:
          GIT_LFS_SKIP_SMUDGE: 1

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:\s*//' | sed -E 's/\+.*$//' | tr -d ' ')
          echo "version=$v" >> $GITHUB_OUTPUT

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=.vscode/env.json --no-pub
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          # 让 AltStore/侧载工具能接受：对已签名的 framework 重新做 ad-hoc 签名
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -r9 PiliPlus_ios_${{ steps.ver.outputs.version }}.ipa Payload

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: PiliPlus_ios_*.ipa

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: iOS-ipa
          path: PiliPlus_ios_*.ipa
